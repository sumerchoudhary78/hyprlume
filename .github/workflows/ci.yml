name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prepare the checked native speech runtime
        run: |
          speech_archive="$RUNNER_TEMP/sherpa-onnx-v2.0.1-linux-x64-static-lib.tar.bz2"
          curl --fail --location --retry 3 --output "$speech_archive" https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-linux-x64-static-lib.tar.bz2
          echo "55cfadf65ba50d0afc1a802b7a337942819e51c94a5b5a384def1978f7c70871  $speech_archive" | sha256sum --check -
          tar -xjf "$speech_archive" -C "$RUNNER_TEMP"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/sherpa-onnx-v2.0.1-linux-x64-static-lib/lib" >> "$GITHUB_ENV"
          cargo clean -p sherpa-onnx-sys
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked
      - run: python3 scripts/check-units.py --binary target/debug/hyprlume
      - run: cargo check --locked --no-default-features
      - run: python3 -m py_compile scripts/hyprlume-models
  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static QML checks (imports, brackets, duplicate ids)
        run: python3 scripts/check-qml.py shell
      - run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - run: /usr/lib/qt6/bin/qmltestrunner -input tests/qml -o -,txt
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
