name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native D-Bus development headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libpolkit-agent-1-dev pkg-config dbus-daemon
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prepare the checked native speech runtime
        run: |
          speech_archive="$RUNNER_TEMP/sherpa-onnx-v2.0.1-linux-x64-static-lib.tar.bz2"
          curl --fail --location --retry 3 --output "$speech_archive" https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-linux-x64-static-lib.tar.bz2
          echo "55cfadf65ba50d0afc1a802b7a337942819e51c94a5b5a384def1978f7c70871  $speech_archive" | sha256sum --check -
          tar -xjf "$speech_archive" -C "$RUNNER_TEMP"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/sherpa-onnx-v2.0.1-linux-x64-static-lib/lib" >> "$GITHUB_ENV"
          cargo clean -p sherpa-onnx-sys
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked
      - run: python3 scripts/qa/check-desktop-tools.py --binary target/debug/hyprlume
      - run: python3 scripts/qa/check-settings.py --binary target/debug/hyprlume
      - run: python3 scripts/check-units.py --binary target/debug/hyprlume
      - run: cargo test --locked --no-default-features --all-targets
      - run: python3 -m py_compile scripts/hyprlume-models
      - name: Build the isolated native service test binary
        run: cargo build --locked --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: native-service-test-binary
          path: target/debug/hyprlume
  qml:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install the native shell and isolated display tools
        run: pacman -Syu --noconfirm --needed git python python-pillow python-dbus-next gtk3 pipewire quickshell qt6-quick3d qt6-shadertools xorg-server-xvfb xorg-xauth dbus xdotool inter-font ttf-jetbrains-mono
      - uses: actions/checkout@v4
      - name: Record graphics runtime versions
        run: pacman -Q quickshell qt6-declarative qt6-quick3d mesa
      - name: Check QML imports and Python tools
        run: |
          python3 scripts/check-qml.py shell
          python3 scripts/build-shaders.py --check
          python3 scripts/build-shaders.py
          python3 scripts/build-shaders.py --check
          python3 -m compileall -q scripts
      - name: Smoke the actual offline shell entry
        run: python3 scripts/qa/check-shell.py
      - name: Exercise the Polkit dialog and private UI pipes
        run: python3 scripts/qa/check-polkit-ui.py
      - name: Check liquid volume and paused motion
        run: python3 scripts/qa/check-effects.py
      - name: Render the desktop with real Qt Quick 3D
        run: python3 scripts/qa/render-desktop.py --width 1920 --height 1080 --output output/design/desktop.png
      - name: Exercise pointer, keyboard, preview and confirmation
        run: python3 scripts/qa/render-desktop.py --interact
      - name: Exercise Wi-Fi and Bluetooth with synthetic hardware
        run: python3 scripts/qa/render-desktop.py --connectivity --interact
      - name: Exercise notifications with synthetic clients
        run: python3 scripts/qa/render-desktop.py --notifications --interact
      - name: Exercise private PipeWire and MPRIS adapters
        run: python3 scripts/qa/check-audio.py
      - name: Exercise private StatusNotifier and DBusMenu adapters
        run: python3 scripts/qa/check-tray.py
      - name: Exercise desktop-entry indexing and launcher input
        run: |
          python3 scripts/qa/check-launcher.py
          python3 scripts/qa/render-desktop.py --launcher --interact
          python3 scripts/qa/render-desktop.py --launcher --output output/design/launcher.png
          python3 scripts/qa/render-desktop.py --launcher --width 960 --height 640 --reduced-effects --output output/design/launcher-compact.png
      - name: Exercise clipboard and capture controls with synthetic data
        run: |
          python3 scripts/qa/render-desktop.py --tools --interact
          python3 scripts/qa/render-desktop.py --tools --output output/design/tools.png
          python3 scripts/qa/render-desktop.py --tools --width 960 --height 640 --reduced-effects --output output/design/tools-compact.png
      - name: Exercise synthetic lock controls without locking the test display
        run: python3 scripts/qa/render-desktop.py --locking --interact
      - name: Exercise persisted settings controls
        run: |
          python3 scripts/qa/render-desktop.py --settings --interact
          python3 scripts/qa/render-desktop.py --settings --output output/design/settings.png
          python3 scripts/qa/render-desktop.py --settings --settings-tab 1 --output output/design/settings-voice.png
          python3 scripts/qa/render-desktop.py --settings --settings-tab 2 --output output/design/settings-shortcuts.png
          python3 scripts/qa/render-desktop.py --settings --settings-tab 4 --output output/design/settings-idle.png
          python3 scripts/qa/render-desktop.py --settings --settings-tab 5 --output output/design/settings-portals.png
          python3 scripts/qa/render-desktop.py --settings --width 960 --height 640 --reduced-effects --output output/design/settings-compact.png
          python3 scripts/qa/render-desktop.py --tools --tools-capture --output output/design/capture.png
      - name: Exercise tray icons, menus and keyboard navigation
        run: |
          python3 scripts/qa/render-desktop.py --tray --interact
          python3 scripts/qa/render-desktop.py --tray --tray-state empty --interact
      - name: Render tray and compact menus
        run: |
          python3 scripts/qa/render-desktop.py --tray --output output/design/tray.png
          python3 scripts/qa/render-desktop.py --tray --width 960 --height 640 --reduced-effects --output output/design/tray-compact.png
      - name: Exercise sound and media controls with real input
        run: python3 scripts/qa/render-desktop.py --audio --interact
      - name: Exercise power and session controls using synthetic services
        run: |
          python3 scripts/qa/render-desktop.py --power --interact
          python3 scripts/qa/render-desktop.py --power --interact --width 960 --height 640 --reduced-effects
          python3 scripts/qa/render-desktop.py --power --power-state unavailable --interact
          python3 scripts/qa/render-desktop.py --power --power-state inhibited --interact
      - name: Render power, review and unavailable states
        run: |
          python3 scripts/qa/render-desktop.py --power --output output/design/power.png
          python3 scripts/qa/render-desktop.py --power --power-state review --output output/design/power-review.png
          python3 scripts/qa/render-desktop.py --power --power-state unavailable --output output/design/power-unavailable.png
          python3 scripts/qa/render-desktop.py --power --power-state desktop --output output/design/power-desktop.png
          python3 scripts/qa/render-desktop.py --power --width 960 --height 640 --reduced-effects --output output/design/power-compact.png
      - name: Render audio, compact and unavailable states
        run: |
          python3 scripts/qa/render-desktop.py --audio --output output/design/audio.png
          python3 scripts/qa/render-desktop.py --audio --width 960 --height 640 --reduced-effects --output output/design/audio-compact.png
          python3 scripts/qa/render-desktop.py --audio --audio-state unavailable --output output/design/audio-unavailable.png
      - name: Render notification centre and non-focus-stealing popups
        run: |
          python3 scripts/qa/render-desktop.py --notifications --output output/design/notifications.png
          python3 scripts/qa/render-desktop.py --notifications --width 960 --height 640 --reduced-effects --output output/design/notifications-compact.png
          python3 scripts/qa/render-desktop.py --notification-popups --output output/design/notification-popups.png
      - name: Render wireless and pairing states
        run: |
          python3 scripts/qa/render-desktop.py --connectivity --output output/design/connections.png
          python3 scripts/qa/render-desktop.py --connectivity --connectivity-state pairing --output output/design/pairing.png
          python3 scripts/qa/render-desktop.py --connectivity --connectivity-state pin --width 700 --height 680 --output output/design/pairing-pin.png
          python3 scripts/qa/render-desktop.py --connectivity --connectivity-state unavailable --width 960 --height 640 --output output/design/wireless-unavailable.png
      - name: Check compact and reduced-effects compositions
        run: |
          python3 scripts/qa/render-desktop.py --width 960 --height 640 --output output/design/compact.png
          python3 scripts/qa/render-desktop.py --reduced-effects --output output/design/reduced.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-previews
          path: output/design/*.png
  wayland-services:
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-service-test-binary
          path: output/native
      - name: Install disposable Wayland/PAM test dependencies
        run: sudo apt-get update && sudo apt-get install -y sway swayidle swaylock wl-clipboard grim slurp wf-recorder wtype ffmpeg librsvg2-bin dbus-user-session polkitd libpolkit-agent-1-0
      - name: Qualify real Polkit authorization and PAM
        run: |
          chmod +x output/native/hyprlume
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/qa/check-polkit-native.py --binary output/native/hyprlume
      - name: Qualify real clipboard, capture and secure locking
        run: |
          chmod +x output/native/hyprlume
          sudo --preserve-env=GITHUB_ACTIONS python3 scripts/qa/check-wayland-services.py --ci-provision --binary output/native/hyprlume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-wayland-service-report
          path: output/design/wayland/
  portals:
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-service-test-binary
          path: output/native
      - name: Install the portal and isolated display tools
        run: sudo apt-get update && sudo apt-get install -y xdg-desktop-portal xdg-desktop-portal-gtk libpolkit-agent-1-0 python3-dbus-next python3-pyatspi xvfb xauth xdotool dbus
      - name: Exercise the real portal gateway and GTK file dialogs
        run: |
          chmod +x output/native/hyprlume
          /usr/bin/python3 scripts/qa/check-portals.py --binary output/native/hyprlume
