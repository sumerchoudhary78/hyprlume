[package]
name = "hyprlume"
version = "0.5.1"
edition = "2021"
rust-version = "1.90"
description = "A glass command shell and local voice companion for Hyprland, powered by HyprPilot"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sumerchoudhary78/hyprlume"
keywords = ["hyprland", "wayland", "voice", "desktop", "quickshell"]
categories = ["command-line-utilities", "gui"]

[features]
default = ["voice"]
voice = ["dep:sherpa-onnx"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
hyprpilot-core = { git = "https://github.com/sumerchoudhary78/HyprPilot", rev = "de1f0f4ae25aabe3fcf4964150eb33c1386cd9d4" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "=2.0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.20"
gio = "0.20"
polkit-agent-rs = "=0.3.0"
nmrs = "=3.5.12"
bluer = { version = "=0.17.4", features = ["bluetoothd"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
